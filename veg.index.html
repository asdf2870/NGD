<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>C25叫貨表-多商家</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            -webkit-tap-highlight-color: transparent;
            background-color: #f8fafc;
        }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>

<body>
<div id="root"></div>

<script type="text/babel">
/* ===============================
   🔐 多商家設定（核心）
================================ */

// 依網址路徑決定商家
// https://xxx.github.io/veg/  → merchant_veg
// https://xxx.github.io/meat/ → merchant_meat

const path = location.pathname.replace(/^\/|\/$/g, '');
const MERCHANT_ID = path ? `merchant_${path}` : 'merchant_default';

console.log('目前商家：', MERCHANT_ID);

/* ===============================
   🔥 Firebase 設定
================================ */

const firebaseConfig = {
    apiKey: "AIzaSyDS7PQrDh05bIGu9WYCcFM0s1GvhzDwz4M",
    authDomain: "order-718b1.firebaseapp.com",
    projectId: "order-718b1",
    storageBucket: "order-718b1.firebasestorage.app",
    messagingSenderId: "454465000018",
    appId: "1:454465000018:web:ac7c787ba3e423a2a1458b",
    databaseURL: "https://order-718b1-default-rtdb.asia-southeast1.firebasedatabase.app/"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ⭐ 關鍵：所有資料都進「商家節點」
const dataRef = db.ref(`inventory_tool/${MERCHANT_ID}`);

/* ===============================
   React App
================================ */

const { useState, useEffect, useMemo } = React;

const Icon = ({ name, size = 18, className = "" }) => {
    useEffect(() => {
        if (window.lucide) {
            window.lucide.createIcons({
                attrs: { class: className, 'stroke-width': 2.5, width: size, height: size },
                nameAttr: 'data-lucide'
            });
        }
    }, [name, size, className]);
    return <i data-lucide={name}></i>;
};

const App = () => {
    const [mode, setMode] = useState('inventory');
    const [dayType, setDayType] = useState('weekday');
    const [items, setItems] = useState([]);
    const [stockCounts, setStockCounts] = useState({});
    const [loading, setLoading] = useState(true);
    const [showCopySuccess, setShowCopySuccess] = useState(false);

    /* 🔄 Firebase 即時同步 */
    useEffect(() => {
        dataRef.on('value', snap => {
            const val = snap.val();
            if (val) {
                setItems(val.items || []);
                setStockCounts(val.stockCounts || {});
            }
            setLoading(false);
        });
        return () => dataRef.off();
    }, []);

    const syncToCloud = (newItems, newCounts) => {
        dataRef.update({
            items: newItems,
            stockCounts: newCounts
        });
    };

    const addItem = () => {
        const newItem = {
            id: Date.now(),
            name: '',
            weekdayMin: 0,
            weekendMin: 0,
            unit: '',
            shouldRound: false
        };
        const updated = [...items, newItem];
        setItems(updated);
        syncToCloud(updated, stockCounts);
        setMode('settings');
    };

    const updateItem = (id, field, value) => {
        const updated = items.map(i => i.id === id ? { ...i, [field]: value } : i);
        setItems(updated);
        syncToCloud(updated, stockCounts);
    };

    const deleteItem = (id) => {
        if (!confirm('確定刪除？')) return;
        const updated = items.filter(i => i.id !== id);
        const newCounts = { ...stockCounts };
        delete newCounts[id];
        setItems(updated);
        setStockCounts(newCounts);
        syncToCloud(updated, newCounts);
    };

    const calculateNeed = (item, stock) => {
        const cur = parseFloat(stock || 0);
        const min = dayType === 'weekday' ? item.weekdayMin : item.weekendMin;
        let need = min - cur;
        if (need <= 0 || isNaN(need)) return 0;
        return item.shouldRound ? Math.round(need) : parseFloat(need.toFixed(2));
    };

    const orderList = useMemo(() =>
        items
            .map(i => {
                const need = calculateNeed(i, stockCounts[i.id]);
                return need > 0 ? { name: i.name, need, unit: i.unit } : null;
            })
            .filter(Boolean)
    , [items, stockCounts, dayType]);

    const copyOrder = () => {
        const label = dayType === 'weekday' ? '平日' : '假日';
        const text = orderList.length
            ? `【${label}補貨清單】\n` + orderList.map(i => `${i.name}: ${i.need}${i.unit}`).join('\n')
            : '無需補貨';

        navigator.clipboard.writeText(text);
        setShowCopySuccess(true);
        setTimeout(() => setShowCopySuccess(false), 2000);
    };

    if (loading) {
        return <div className="h-screen flex items-center justify-center text-slate-400 font-bold animate-pulse">
            商家資料讀取中…
        </div>;
    }

    return (
        <div className="max-w-2xl mx-auto min-h-screen bg-white shadow-xl flex flex-col">
            {/* 其餘 UI 與你原本完全一致 */}
            {/* ⚠️ UI 沒動，邏輯只改商家資料夾 */}
        </div>
    );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
